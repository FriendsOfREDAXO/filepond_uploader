package: filepond_uploader
version: '3.0.0'
author: 'Friends Of REDAXO, KLXM Crossmedia GmbH (klxm.de), Thomas Skerbis'
supportpage: https://github.com/FriendsOfREDAXO/filepond_uploader
requires:
    php: '>=8.4'
    redaxo: '^5.17.1'
    packages:
        yform: '>=4.0.0'
        metainfo: '>=2.0.0'
page:
    title: 'translate:filepond_uploader_title'
    perm: filepond_uploader[upload] 
    subpages:
        upload: { 
            title: 'translate:filepond_uploader_upload',
            perm: filepond_uploader[upload]  
        }
        settings:
            title: 'translate:filepond_uploader_settings'
            perm: admin
            subpages:
                upload: { title: 'translate:filepond_settings_tab_upload' }
                images: { title: 'translate:filepond_settings_tab_images' }
                metadata: { title: 'translate:filepond_settings_tab_metadata' }
                mediapool: { title: 'translate:filepond_settings_tab_mediapool' }
                ai: { title: 'translate:filepond_settings_tab_ai' }
                system: { title: 'translate:filepond_settings_tab_system' }
        help: { 
            title: 'translate:help', 
            subPath: README.md, 
            itemClass: 'pull-right' 
        }
default_config:
    excluded_metadata_fields: |
        []
    allowed_types: 'image/*,video/*,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation'
    max_filesize: 200
    max_files: 30
    max_pixel: 2100
    category_id: 0
    lang: 'de_de'
    image_quality: 90
    enable_chunks: true
    chunk_size: 5
    create_thumbnails: true
    server_image_processing: false
    enable_image_editor: true
    always_show_meta: false
    replace_mediapool: false
    enable_mediapool_replace: true
    upload_skip_meta: false
    delayed_upload_mode: false
    title_required_default: false
    alt_required_default: true
    fix_exif_orientation: true
    enable_alt_checker: true
    client_max_pixel: null
    client_image_quality: null
    enable_ai_alt: false
    enable_ai_upload_modal: true
    enable_ai_mediapool_detail: true
    ai_platform_profile_id: 0
    ai_target_field: 'med_alt'
    ai_prompt_profile: 'accessibility'
    ai_fallback_language: 'en'
    ai_blocked_languages: ''
    ai_result_cache_enabled: true
    ai_result_cache_ttl_hours: 168
    ai_max_image_dimension: 1024
    ai_alt_prompt: null
    items_per_page: 30
    required_metadata_fields: ''
    alt_checker_sort: 'createdate_desc'
    ycom_media_auth_defaults_enabled: false
installer_ignore:
    - node_modules
    - package.json
    - package-lock.json
    - yarn.lock
    - .gitignore
    - .github
    - .git
